<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZenCloak</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/lucide.min.js" defer></script>
  <script src="app.js" defer></script>
  <script src="file-mode.js" defer></script>
  <script src="url-opener.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">Z</div>
        <div class="brand-text">
          <strong>ZenCloak</strong>
          <span id="engineLabel">引擎检测中</span>
        </div>
      </div>
      <button id="newProfileBtn" class="btn primary">
        <i data-lucide="plus"></i>新建档案
      </button>
      <div class="sidebar-actions">
        <button id="importProfileBtn" class="btn" title="导入档案" type="button">
          <i data-lucide="upload"></i>
        </button>
      </div>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
      <nav id="profileList" class="profile-list" aria-label="指纹档案"></nav>
      <div class="sidebar-foot">
        <button id="backupBtn" class="btn foot-btn" type="button" title="加密备份全部档案">
          <i data-lucide="folder-down"></i>备份
        </button>
        <button id="restoreBtn" class="btn foot-btn" type="button" title="从加密备份恢复">
          <i data-lucide="archive-restore"></i>恢复
        </button>
        <button id="recycleBinBtn" class="btn foot-btn" type="button">
          <i data-lucide="trash-2"></i>回收站
        </button>
        <button id="quitBtn" class="btn foot-btn" type="button">
          <i data-lucide="power"></i>退出
        </button>
        <input id="backupFile" type="file" accept=".zip,application/zip" hidden>
        <div class="engine-row">
          <span id="engineDot" class="dot"></span>
          <span id="engineVersion">CloakBrowser</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="toolbar">
        <div class="title-block">
          <h1 id="profileTitle">未选择档案</h1>
          <div class="status-row">
            <span id="statusBadge" class="badge stopped">已停止</span>
            <span id="statusTime"></span>
          </div>
        </div>
        <div class="toolbar-actions">
          <button id="stopBtn" class="btn" title="停止当前档案" disabled><i data-lucide="square"></i>停止</button>
          <button id="launchBtn" class="btn primary" title="启动当前档案"><i data-lucide="play"></i>启动</button>
          <button id="saveBtn" class="btn dark" title="保存当前档案"><i data-lucide="save"></i>保存</button>
          <div class="more-menu">
            <button id="moreBtn" class="btn icon" title="更多操作" type="button" aria-haspopup="menu" aria-expanded="false">
              <i data-lucide="more-horizontal"></i>
            </button>
            <div id="moreMenu" class="menu" role="menu" hidden>
              <button id="duplicateBtn" class="menu-item" role="menuitem" disabled><i data-lucide="copy"></i>复制档案</button>
              <button id="exportBtn" class="menu-item" role="menuitem" disabled><i data-lucide="download"></i>导出档案</button>
              <button id="downloadsBtn" class="menu-item" role="menuitem" disabled><i data-lucide="folder-open"></i>下载目录</button>
              <button id="healthBtn" class="menu-item" role="menuitem" disabled><i data-lucide="activity"></i>指纹体检</button>
              <div class="menu-sep"></div>
              <button id="batchLaunchBtn" class="menu-item" role="menuitem" disabled><i data-lucide="play"></i>批量启动所选</button>
              <button id="batchStopBtn" class="menu-item" role="menuitem" disabled><i data-lucide="square"></i>批量停止所选</button>
              <div class="menu-sep"></div>
              <button id="deleteBtn" class="menu-item danger" role="menuitem"><i data-lucide="trash-2"></i>删除档案</button>
            </div>
          </div>
        </div>
      </header>

      <div id="consistencyBanner" class="consistency-banner" hidden></div>

      <section id="recycleView" class="recycle-view" hidden>
        <div class="recycle-head">
          <h2>回收站</h2>
          <button id="recycleBackBtn" class="btn" type="button"><i data-lucide="arrow-left"></i>返回</button>
        </div>
        <div id="recycleList" class="recycle-list"></div>
      </section>

      <section class="panel">
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="basic" role="tab" aria-selected="true">基本信息</button>
          <button class="tab" data-tab="fingerprint" role="tab" aria-selected="false">指纹</button>
          <button class="tab" data-tab="proxy" role="tab" aria-selected="false">代理</button>
          <button class="tab" data-tab="behavior" role="tab" aria-selected="false">行为</button>
        </div>
        <form id="profileForm" class="form">
          <div class="view active" data-view="basic">
            <div class="field">
              <label for="name">档案名称</label>
              <input id="name" type="text" maxlength="32" required>
            </div>
            <div class="field">
              <label>识别色</label>
              <div id="colorPicker" class="colors"></div>
            </div>
            <div class="field full">
              <label for="startUrl">起始页</label>
              <input id="startUrl" type="url" placeholder="https://">
            </div>
            <div class="field full">
              <label for="notes">备注</label>
              <textarea id="notes"></textarea>
            </div>
          </div>

          <div class="view" data-view="fingerprint">
            <div class="field">
              <label for="seed">指纹种子</label>
              <input id="seed" type="number" min="10000" max="99999" step="1">
            </div>
            <div class="field">
              <label for="timezone">时区</label>
              <select id="timezone">
                <optgroup label="亚洲">
                  <option value="Asia/Shanghai">Asia/Shanghai（中国大陆）</option>
                  <option value="Asia/Taipei">Asia/Taipei（中国台湾）</option>
                  <option value="Asia/Hong_Kong">Asia/Hong_Kong（中国香港）</option>
                  <option value="Asia/Singapore">Asia/Singapore（新加坡）</option>
                  <option value="Asia/Kuala_Lumpur">Asia/Kuala_Lumpur（马来西亚）</option>
                  <option value="Asia/Jakarta">Asia/Jakarta（印尼）</option>
                  <option value="Asia/Manila">Asia/Manila（菲律宾）</option>
                  <option value="Asia/Bangkok">Asia/Bangkok（泰国）</option>
                  <option value="Asia/Ho_Chi_Minh">Asia/Ho_Chi_Minh（越南）</option>
                  <option value="Asia/Tokyo">Asia/Tokyo（日本）</option>
                  <option value="Asia/Seoul">Asia/Seoul（韩国）</option>
                  <option value="Asia/Kolkata">Asia/Kolkata（印度）</option>
                  <option value="Asia/Dubai">Asia/Dubai（迪拜）</option>
                  <option value="Asia/Riyadh">Asia/Riyadh（沙特）</option>
                </optgroup>
                <optgroup label="欧洲">
                  <option value="Europe/London">Europe/London（英国）</option>
                  <option value="Europe/Dublin">Europe/Dublin（爱尔兰）</option>
                  <option value="Europe/Lisbon">Europe/Lisbon（葡萄牙）</option>
                  <option value="Europe/Madrid">Europe/Madrid（西班牙）</option>
                  <option value="Europe/Paris">Europe/Paris（法国）</option>
                  <option value="Europe/Brussels">Europe/Brussels（比利时）</option>
                  <option value="Europe/Amsterdam">Europe/Amsterdam（荷兰）</option>
                  <option value="Europe/Berlin">Europe/Berlin（德国）</option>
                  <option value="Europe/Zurich">Europe/Zurich（瑞士）</option>
                  <option value="Europe/Rome">Europe/Rome（意大利）</option>
                  <option value="Europe/Vienna">Europe/Vienna（奥地利）</option>
                  <option value="Europe/Warsaw">Europe/Warsaw（波兰）</option>
                  <option value="Europe/Prague">Europe/Prague（捷克）</option>
                  <option value="Europe/Budapest">Europe/Budapest（匈牙利）</option>
                  <option value="Europe/Stockholm">Europe/Stockholm（瑞典）</option>
                  <option value="Europe/Oslo">Europe/Oslo（挪威）</option>
                  <option value="Europe/Copenhagen">Europe/Copenhagen（丹麦）</option>
                  <option value="Europe/Helsinki">Europe/Helsinki（芬兰）</option>
                  <option value="Europe/Athens">Europe/Athens（希腊）</option>
                  <option value="Europe/Kyiv">Europe/Kyiv（乌克兰）</option>
                  <option value="Europe/Moscow">Europe/Moscow（俄罗斯）</option>
                  <option value="Europe/Istanbul">Europe/Istanbul（土耳其）</option>
                </optgroup>
                <optgroup label="北美">
                  <option value="America/New_York">America/New_York（美东）</option>
                  <option value="America/Toronto">America/Toronto（多伦多）</option>
                  <option value="America/Chicago">America/Chicago（美中）</option>
                  <option value="America/Denver">America/Denver（山地）</option>
                  <option value="America/Los_Angeles">America/Los_Angeles（美西）</option>
                  <option value="America/Vancouver">America/Vancouver（温哥华）</option>
                  <option value="America/Mexico_City">America/Mexico_City（墨西哥城）</option>
                </optgroup>
                <optgroup label="南美">
                  <option value="America/Bogota">America/Bogota（波哥大）</option>
                  <option value="America/Lima">America/Lima（利马）</option>
                  <option value="America/Santiago">America/Santiago（圣地亚哥）</option>
                  <option value="America/Sao_Paulo">America/Sao_Paulo（圣保罗）</option>
                  <option value="America/Buenos_Aires">America/Buenos_Aires（布宜诺斯艾利斯）</option>
                </optgroup>
                <optgroup label="大洋洲">
                  <option value="Australia/Perth">Australia/Perth（珀斯）</option>
                  <option value="Australia/Brisbane">Australia/Brisbane（布里斯班）</option>
                  <option value="Australia/Sydney">Australia/Sydney（悉尼）</option>
                  <option value="Australia/Melbourne">Australia/Melbourne（墨尔本）</option>
                  <option value="Pacific/Auckland">Pacific/Auckland（奥克兰）</option>
                </optgroup>
                <optgroup label="非洲">
                  <option value="Africa/Cairo">Africa/Cairo（开罗）</option>
                  <option value="Africa/Lagos">Africa/Lagos（拉各斯）</option>
                  <option value="Africa/Johannesburg">Africa/Johannesburg（约翰内斯堡）</option>
                </optgroup>
              </select>
            </div>
            <div class="field">
              <label for="locale">语言</label>
              <select id="locale">
                <optgroup label="中文">
                  <option value="zh-CN">zh-CN（简体·中国大陆）</option>
                  <option value="zh-TW">zh-TW（繁体·台湾）</option>
                  <option value="zh-HK">zh-HK（繁体·香港）</option>
                  <option value="zh-SG">zh-SG（简体·新加坡）</option>
                </optgroup>
                <optgroup label="英语">
                  <option value="en-US">en-US（美国）</option>
                  <option value="en-GB">en-GB（英国）</option>
                  <option value="en-CA">en-CA（加拿大）</option>
                  <option value="en-AU">en-AU（澳大利亚）</option>
                  <option value="en-NZ">en-NZ（新西兰）</option>
                  <option value="en-IE">en-IE（爱尔兰）</option>
                  <option value="en-IN">en-IN（印度）</option>
                  <option value="en-SG">en-SG（新加坡）</option>
                </optgroup>
                <optgroup label="亚洲">
                  <option value="ja-JP">ja-JP（日语）</option>
                  <option value="ko-KR">ko-KR（韩语）</option>
                  <option value="th-TH">th-TH（泰语）</option>
                  <option value="vi-VN">vi-VN（越南语）</option>
                  <option value="id-ID">id-ID（印尼语）</option>
                  <option value="ms-MY">ms-MY（马来语）</option>
                  <option value="fil-PH">fil-PH（菲律宾语）</option>
                </optgroup>
                <optgroup label="欧洲">
                  <option value="de-DE">de-DE（德语）</option>
                  <option value="fr-FR">fr-FR（法语）</option>
                  <option value="es-ES">es-ES（西班牙语·西班牙）</option>
                  <option value="es-MX">es-MX（西班牙语·墨西哥）</option>
                  <option value="pt-BR">pt-BR（葡萄牙语·巴西）</option>
                  <option value="pt-PT">pt-PT（葡萄牙语·葡萄牙）</option>
                  <option value="it-IT">it-IT（意大利语）</option>
                  <option value="nl-NL">nl-NL（荷兰语）</option>
                  <option value="pl-PL">pl-PL（波兰语）</option>
                  <option value="cs-CZ">cs-CZ（捷克语）</option>
                  <option value="sv-SE">sv-SE（瑞典语）</option>
                  <option value="da-DK">da-DK（丹麦语）</option>
                  <option value="fi-FI">fi-FI（芬兰语）</option>
                  <option value="el-GR">el-GR（希腊语）</option>
                  <option value="ru-RU">ru-RU（俄语）</option>
                  <option value="uk-UA">uk-UA（乌克兰语）</option>
                  <option value="tr-TR">tr-TR（土耳其语）</option>
                </optgroup>
                <optgroup label="中东">
                  <option value="ar-SA">ar-SA（阿拉伯语·沙特）</option>
                  <option value="ar-EG">ar-EG（阿拉伯语·埃及）</option>
                  <option value="he-IL">he-IL（希伯来语）</option>
                </optgroup>
              </select>
            </div>
            <div class="field">
              <label for="screen">屏幕</label>
              <select id="screen">
                <option value="1366x768">1366 x 768</option>
                <option value="1440x900">1440 x 900</option>
                <option value="1536x864">1536 x 864</option>
                <option value="1920x1080">1920 x 1080</option>
                <option value="2560x1440">2560 x 1440</option>
              </select>
            </div>
            <div class="field">
              <label for="hardwareConcurrency">CPU 核数</label>
              <select id="hardwareConcurrency">
                <option value="2">2</option>
                <option value="4">4</option>
                <option value="8">8</option>
                <option value="12">12</option>
                <option value="16">16</option>
              </select>
            </div>
            <div class="field">
              <label for="deviceMemory">设备内存</label>
              <select id="deviceMemory">
                <option value="4">4 GB</option>
                <option value="8">8 GB</option>
                <option value="16">16 GB</option>
                <option value="32">32 GB</option>
              </select>
            </div>
            <div class="field full">
              <label for="userAgent">User-Agent</label>
              <input id="userAgent" type="text" placeholder="留空使用默认">
            </div>
          </div>

          <div class="view" data-view="proxy">
            <div class="field full toggle-field">
              <label class="toggle">
                <input id="proxyBuiltin" type="checkbox">
                <span>启用内置 Mihomo 代理</span>
              </label>
            </div>
            <div id="builtinProxySection">
              <div class="field full">
                <label for="proxyImportUrl">订阅地址</label>
                <div class="inline-row">
                  <input id="proxyImportUrl" type="url" placeholder="https://example.com/config.yaml">
                  <button id="proxyImportBtn" class="btn" type="button">导入订阅</button>
                </div>
              </div>
              <div class="field full">
                <label for="proxySubscription">订阅</label>
                <div class="inline-row">
                  <select id="proxySubscription"></select>
                  <button id="proxyRefreshBtn" class="btn" type="button" title="重新拉取机场节点">
                    <i data-lucide="refresh-cw"></i>刷新
                  </button>
                  <button id="proxyDeleteBtn" class="btn danger" type="button" title="删除当前订阅">
                    <i data-lucide="trash-2"></i>
                  </button>
                </div>
              </div>
              <div class="field">
                <label for="proxyRegion">地区</label>
                <select id="proxyRegion">
                  <option value="">全部地区</option>
                </select>
              </div>
              <div class="field">
                <label for="proxyNodeTrigger">出口节点</label>
                <div class="node-select">
                  <button type="button" id="proxyNodeTrigger" class="node-trigger" disabled>
                    <span class="node-name">选择节点</span>
                  </button>
                  <div id="proxyNodeList" class="node-list" hidden></div>
                </div>
              </div>
              <div class="field full">
                <button id="proxyTestBtn" class="btn" type="button" title="选了地区则测该地区全部节点，否则只测当前节点">
                  <i data-lucide="gauge"></i>测速
                </button>
                <span id="proxyStatusText" class="muted"></span>
              </div>
            </div>
            <div id="manualProxySection">
              <div class="field full toggle-field">
                <label class="toggle">
                  <input id="proxyEnabled" type="checkbox">
                  <span>启用手动代理（HTTP / SOCKS5）</span>
                </label>
              </div>
              <div class="field">
                <label for="proxyType">代理协议</label>
                <select id="proxyType">
                  <option value="http">HTTP</option>
                  <option value="socks5">SOCKS5</option>
                </select>
              </div>
              <div class="field">
                <label for="proxyHost">主机</label>
                <input id="proxyHost" type="text" placeholder="proxy.example.com">
              </div>
              <div class="field">
                <label for="proxyPort">端口</label>
                <input id="proxyPort" type="number" min="1" max="65535" placeholder="8080">
              </div>
              <div class="field">
                <label for="proxyUsername">用户名</label>
                <input id="proxyUsername" type="text" autocomplete="off">
              </div>
              <div class="field">
                <label for="proxyPassword">密码</label>
                <input id="proxyPassword" type="password" autocomplete="new-password">
              </div>
            </div>
          </div>

          <div class="view" data-view="behavior">
            <div class="field full toggle-field">
              <label class="toggle">
                <input id="humanize" type="checkbox">
                <span>类人行为</span>
              </label>
            </div>
            <div class="field">
              <label for="humanPreset">行为预置</label>
              <select id="humanPreset">
                <option value="default">Default</option>
                <option value="careful">Careful</option>
                <option value="quick">Quick</option>
              </select>
            </div>
            <div class="field full toggle-field">
              <label class="toggle">
                <input id="translateButton" type="checkbox">
                <span>页面浮动翻译按钮（会在每个网页注入元素，介意指纹一致性请保持关闭；右键菜单与 Alt+Shift+T 不受影响）</span>
              </label>
            </div>
            <div class="field full toggle-field">
              <label class="toggle">
                <input id="cdpAttach" type="checkbox">
                <span>暴露 CDP 调试端口（供外部 Playwright / Selenium 脚本 attach，见 docs/attach.md；本机任意进程可完全控制该浏览器，慎用）</span>
              </label>
            </div>
            <div class="field full toggle-field">
              <label class="toggle">
                <input id="spoofVoices" type="checkbox">
                <span>语音包伪装（按档案语言重写 TTS 语音列表，修复「语音包国家 ↔ IP 国家」异常；若检测站报 toString 篡改可关闭）</span>
              </label>
            </div>
          </div>
        </form>
      </section>

      <section class="detect-wrap">
        <div class="detect-bar">
          <button class="detect-btn" data-url="https://browserscan.net/bot-detection" title="BrowserScan"><i data-lucide="scan"></i></button>
          <button class="detect-btn" data-url="https://demo.fingerprint.com/playground" title="FingerprintJS"><i data-lucide="fingerprint"></i></button>
          <button class="detect-btn" data-url="https://browserleaks.com/canvas" title="BrowserLeaks"><i data-lucide="paintbrush"></i></button>
          <button class="detect-btn" data-url="https://bot.incolumitas.com" title="Incolumitas"><i data-lucide="shield"></i></button>
        </div>
      </section>
    </main>
  </div>
  <div id="healthModal" class="modal-backdrop" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2>指纹体检报告</h2>
        <button id="healthCloseBtn" class="btn" type="button"><i data-lucide="x"></i>关闭</button>
      </div>
      <div id="healthSummary" class="health-summary"></div>
      <div id="healthList" class="health-list"></div>
    </div>
  </div>
  <div id="backupModal" class="modal-backdrop" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2>加密备份</h2>
        <button id="backupCloseBtn" class="btn" type="button"><i data-lucide="x"></i>关闭</button>
      </div>
      <div class="modal-body">
        <div class="field full">
          <label for="backupPass">备份口令（至少 8 位，丢失后无法恢复）</label>
          <input id="backupPass" type="password" autocomplete="new-password">
        </div>
        <div class="field full">
          <label for="backupPass2">确认口令</label>
          <input id="backupPass2" type="password" autocomplete="new-password">
        </div>
        <div class="field full toggle-field">
          <label class="toggle">
            <input id="backupIncludeData" type="checkbox" checked>
            <span>包含浏览器数据（登录态 / Cookie，体积较大）</span>
          </label>
        </div>
        <p class="modal-hint">备份保存到 ~/.zencloak/backups/，运行中的档案会自动跳过。</p>
        <div class="modal-actions">
          <button id="backupRunBtn" class="btn primary" type="button"><i data-lucide="folder-down"></i>开始备份</button>
        </div>
      </div>
    </div>
  </div>
  <div id="restoreModal" class="modal-backdrop" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2>恢复备份</h2>
        <button id="restoreCloseBtn" class="btn" type="button"><i data-lucide="x"></i>关闭</button>
      </div>
      <div class="modal-body">
        <p id="restoreFileName" class="modal-hint"></p>
        <div class="field full">
          <label for="restorePass">备份口令</label>
          <input id="restorePass" type="password" autocomplete="new-password">
        </div>
        <div class="field full toggle-field">
          <label class="toggle">
            <input id="restoreOverwrite" type="checkbox">
            <span>覆盖同名档案（默认跳过已存在的）</span>
          </label>
        </div>
        <p class="modal-hint">跨机器恢复后，代理密码需在各档案内重新输入一次。</p>
        <div class="modal-actions">
          <button id="restoreRunBtn" class="btn primary" type="button"><i data-lucide="archive-restore"></i>开始恢复</button>
        </div>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>
</body>
