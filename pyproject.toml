[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zencloak"
version = "0.4.0"
description = "Personal fingerprint browser desktop client powered by CloakBrowser."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "cloakbrowser>=0.2,<0.4",
    "fastapi>=0.141",
    "httpx>=0.28",
    "mcp>=1.2",
    "playwright>=1.60,<1.61",
    "pystray>=0.19",
    "pywebview>=6.0",
    "PyYAML>=6.0",
    "pyzipper>=0.3",
    "uvicorn>=0.49",
]

[project.scripts]
zencloak = "zencloak.app:main"
zencloak-mcp = "zencloak.mcp:main"

[project.optional-dependencies]
camoufox = ["camoufox[geoip]>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/zencloak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
