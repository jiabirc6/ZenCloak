[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zencloak"
version = "0.1.0"
description = "Personal fingerprint browser desktop client powered by CloakBrowser."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "cloakbrowser>=0.2",
    "fastapi>=0.141",
    "httpx>=0.28",
    "pystray>=0.19",
    "pywebview>=6.0",
    "uvicorn>=0.49",
]

[project.scripts]
zencloak = "zencloak.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zencloak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
